# https://python-markdown.github.io/extensions/admonition/

site_name: k8s-tools
theme:
  logo: img/icon-transparent.png
  # name: material 
  name: readthedocs 
  # name: mkdocs
  highlightjs: true
  color_mode: dark
  user_color_mode_toggle: yes
  # icon:
  #   admonition:
  #     note: material/arrow-expand-down
extra_css: ["extra.css"]
repo_url: "https://github.com/elo-enterprises/k8s-tools/"
site_url: https://elo-enterprises.github.io/k8s-tools/
site_description: >-
  Completely dockerized version of a kubernetes toolchain, plus a zero-dependency automation framework for extending and interacting it. Project-local clusters, cluster lifecycle automation, customizable TUIs, and more.
remote_branch: docs
nav:
  - Features: 'features.md'
  - Integration: 'integration.md'
  - compose.mk: 'compose.mk.md'
  - k8s.mk: 'k8s.mk.md'
  - Demos: demos/README.md
  - API: api/README.md
  - limitations.md
  - Source: 'https://elo-enterprises.github.io/k8s-tools/'
plugins:
  - search
  - mkdocstrings:
      handlers:
        # See: https://mkdocstrings.github.io/python/usage/
        python:
          options:
            docstring_style: sphinx

markdown_extensions:
  - admonition
  - pymdownx.details
  - abbr
  - def_list
# nav:
#   - overview.md
#   - features.md
#   - compose.mk.md
#   - k8s.mk.md

docs_dir: docs
site_dir: site
  