# https://python-markdown.github.io/extensions/admonition/

site_name: k8s-tools
theme:
  logo: img/icon-transparent.png
  # name: material 
  name: readthedocs
  custom_dir: docs/theme
  hljs_style: night-owl
  # hljs_style: github-dark
  highlightjs: true
  hljs_languages:
    - yaml
    - makefile
    - bash
    - json
  color_mode: dark
  user_color_mode_toggle: yes
  # icon:
  #   admonition:
  #     note: material/arrow-expand-down
extra_css: ["extra.css"]
site_url: https://elo-enterprises.github.io/k8s-tools/
site_description: >-
  Completely dockerized version of a kubernetes toolchain, plus a zero-dependency automation framework for extending and interacting it. Project-local clusters, cluster lifecycle automation, customizable TUIs, and more.
remote_branch: docs
nav:
  - Overview:
    - Overview: 'overview.md'
    - Features: 'features.md'
    - Integration: 'integration.md'
  - Core Components:
    - 'K8s-tools.yml': 'k8s-tools.yml.md'
    - 'Compose.mk': 'compose.mk.md'
    - 'K8s.mk': 'k8s.mk.md'
  - Demos:
    - demos/cluster.md
    - demos/platform.md
    - demos/mad-science.md
  - API:
    - api/compose.mk.md
    - api/k8s.mk.md
  - Other:
    - 'Configuration / Env Vars': config.md
    - limitations.md
    - contributing.md
    - 'Project Source': 'https://github.com/elo-enterprises/k8s-tools/'
plugins:
  - search
  - autolinks 
  # - mkdocstrings:
  #     handlers:
  #       # See: https://mkdocstrings.github.io/python/usage/
  #       python:
  #         options:
  #           docstring_style: sphinx

markdown_extensions:
  - admonition
  - pymdownx.details
  - abbr
  # - fenced_code_blocks
  - def_list
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  # - pymdownx.superfences
docs_dir: docs
site_dir: site
  